[package]
name = "file-organizer-ai"
version = "0.1.0"
description = "Organizza cartelle con AI locale (Ollama) o Claude API"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
